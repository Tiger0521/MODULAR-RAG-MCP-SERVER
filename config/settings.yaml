# 主配置文件 - Modular RAG MCP Server

# LLM 配置
llm:
  provider: "openai"  # openai, azure, ollama, deepseek
  model: "gpt-4o"
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"
  
  # Azure OpenAI 配置
  azure:
    api_key: "${AZURE_OPENAI_API_KEY}"
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "2024-02-15-preview"
    
  # Ollama 配置
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.1:8b"

# Embedding 配置
embedding:
  provider: "openai"  # openai, azure, ollama, sentence-transformers
  model: "text-embedding-3-small"
  api_key: "${OPENAI_API_KEY}"
  
  # 本地模型配置
  local:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    device: "cpu"

# Vector Store 配置
vector_store:
  provider: "chroma"  # chroma, qdrant, pinecone
  
  # ChromaDB 配置
  chroma:
    persist_directory: "./data/chroma"
    collection_name: "documents"
    
  # Qdrant 配置
  qdrant:
    url: "http://localhost:6333"
    collection_name: "documents"

# BM25 配置
bm25:
  index_directory: "./data/bm25"
  
# 图片存储配置
image_storage:
  directory: "./data/images"
  max_size_mb: 10

# 追踪配置
tracing:
  enabled: true
  output_file: "./logs/traces.jsonl"
  
# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/app.log"

# 评估配置
evaluator:
  backend: "custom"  # custom, ragas
  backends:
    - "custom"

# MCP Server 配置
mcp_server:
  name: "modular-rag-server"
  version: "0.1.0"
  
# 处理配置
processing:
  chunk_size: 1000
  chunk_overlap: 200
  max_concurrent: 4