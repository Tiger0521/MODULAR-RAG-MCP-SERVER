[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "Modular RAG MCP Server for intelligent question answering and knowledge retrieval"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"

[project.dependencies]
pytest = "^7.0"
chromadb = "^1.5"
transformers = "^4.30"
torch = "^2.0"
pdfplumber = "^0.10"
markdown-it-py = "^3.0"
pyyaml = "^6.0"
langchain = "^0.1.0"
pydantic-settings = "^2.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["unit: Unit tests", "integration: Integration tests", "e2e: End-to-end tests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"